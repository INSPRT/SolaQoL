name: Package and Deploy Addon

on:
  push:
    tags:
      - 'v*' # v0.5.3와 같이 'v'로 시작하는 태그를 푸시할 때만 실행됩니다.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub 저장소의 코드를 가져옵니다.
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. BigWigs WoW Addon Packager를 사용해 패키징 및 CurseForge 배포를 진행합니다.
      - name: Package and Release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }} # GitHub Settings에 등록할 CurseForge API 키
